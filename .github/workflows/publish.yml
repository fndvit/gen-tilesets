# Publish `@vit-foundation/gen-tilesets` to the public npm registry on a version tag.
#
# Authentication is npm trusted publishing: npm trusts this repository's
# `publish.yml` (configured on the package's npmjs.com settings page) and the
# job proves who it is with a GitHub OIDC token (`id-token: write`). There is
# no npm token to mint, rotate, or leak into a secret, and npm attaches
# provenance on its own. Rejected: an `NPM_TOKEN` secret, which is exactly the
# long-lived credential this avoids. (Before 0.10.0 the package went to GitHub
# Packages, whose npm registry needs a token even to install a public package.)
#
# pnpm packs and npm publishes. Only pnpm applies `publishConfig.exports`, which
# swaps the workspace's `src` exports for the built `dist` ones; only npm (>=
# 11.5.1) speaks trusted publishing. Publishing the packed tarball gets both.
name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Both must be green — CLAUDE.md. They run before the tarball is built so
      # a red tag fails loudly rather than shipping. `pnpm pack` does not run
      # `prepublishOnly`, so the build is explicit.
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm --filter @vit-foundation/gen-tilesets build

      - run: npm install -g npm@latest

      - working-directory: packages/tileset
        run: |
          pnpm pack
          npm publish ./vit-foundation-gen-tilesets-*.tgz --access public
