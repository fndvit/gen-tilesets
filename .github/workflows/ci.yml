# The gate CLAUDE.md describes: `pnpm test` and `pnpm typecheck` from the root,
# both green, on every branch and pull request.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      # Proves the published tarball still builds, which no test covers.
      - run: pnpm --filter @fndvit/gen-tilesets build
      # The docs site: its coverage check fails when a source file has no page, and the TypeDoc
      # pass fails when the public entry points stop compiling.
      - run: pnpm --filter @fndvit/tileset-docs build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
